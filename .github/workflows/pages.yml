name: Deploy launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: for file in js/*.js; do node --check "$file"; done
      - uses: actions/configure-pages@v5
      - name: Stage public assets
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -r js _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
